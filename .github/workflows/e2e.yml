name: Live end-to-end check

# Runs every feature through the real prompt, tools and network (Gemini as the model).
# WhatsApp messages are captured, never sent. Trigger it by hand: Actions -> Live end-to-end check.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: APP_SECRET
    env:
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      VERIFY_TOKEN: ${{ secrets.VERIFY_TOKEN || vars.VERIFY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng imagemagick
      - name: Find the deployed Worker
        run: |
          sub=$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).result?.subdomain||"")}catch{console.log("")}})')
          echo "WORKER_URL=https://wa-assistant.${sub}.workers.dev" >> "$GITHUB_ENV"
      - name: Probe Gemini
        continue-on-error: true
        run: node --no-warnings scripts/probe_gemini.mjs
      - name: Run every feature
        run: node --no-warnings scripts/e2e.mjs
