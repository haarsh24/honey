name: One-off audio read
on:
  workflow_dispatch:
    inputs:
      audio:
        description: 'base64 audio'
        required: true
jobs:
  read:
    runs-on: ubuntu-latest
    environment: APP_SECRET
    env:
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      AUDIO: ${{ github.event.inputs.audio }}
    steps:
      - name: Transcribe
        run: |
          node --input-type=module -e '
          const body = { contents: [{ parts: [
            { inline_data: { mime_type: "audio/ogg", data: process.env.AUDIO } },
            { text: "Transcribe this voice note word for word in its original language (Hindi/English mix is fine, use Roman letters for Hindi). Output only the transcript." } ] }] };
          for (const model of ["gemini-flash-lite-latest","gemini-flash-latest"]) {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, { method: "POST", headers: { "x-goog-api-key": process.env.GEMINI_KEY, "content-type": "application/json" }, body: JSON.stringify(body) });
            const d = await r.json();
            const t = d?.candidates?.[0]?.content?.parts?.map(p => p.text).join("") ;
            if (t) { console.log("::notice title=transcript::" + t.replace(/\r?\n/g, "%0A")); break; }
            console.log("::notice title=transcript error::" + r.status + " " + JSON.stringify(d).slice(0,200));
          }'
