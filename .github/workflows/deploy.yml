name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you click "Run workflow" in the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Your values live in the GitHub Environment named "APP_SECRET".
    environment: APP_SECRET
    env:
      # Each line accepts the standard name or the name used in this repo (secret or variable).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || secrets.CLOUDFLARE_DB_ID || secrets.CLOUDFARE_DB_ID || vars.D1_DATABASE_ID }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      APP_SECRET: ${{ secrets.APP_SECRET || secrets.WHATSAPP_APP_SECRET }}
      PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID || vars.PHONE_NUMBER_ID || vars.WHATSAPP_PHONE_NUMBER_ID || secrets.WHATSAPP_PHONE_NUMBER_ID }}
      VERIFY_TOKEN: ${{ secrets.VERIFY_TOKEN || vars.VERIFY_TOKEN }}
      OWNER_NUMBER: ${{ secrets.OWNER_NUMBER || vars.OWNER_NUMBER }}
      WABA_ID: ${{ vars.WHATSAPP_BUSINESS_ACCOUNT_ID || vars.WHATSAPP_BUISNESS_ACCOUNT_ID || secrets.WHATSAPP_BUSINESS_ACCOUNT_ID || secrets.WHATSAPP_BUISNESS_ACCOUNT_ID }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check required values
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID WHATSAPP_TOKEN PHONE_NUMBER_ID VERIFY_TOKEN APP_SECRET OWNER_NUMBER; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret or variable: $name"
              missing=1
            fi
          done
          exit $missing

      - name: Insert D1 database id into wrangler.toml
        run: sed -i "s/D1_DATABASE_ID_PLACEHOLDER/${D1_DATABASE_ID}/" wrangler.toml

      - name: Make sure a workers.dev subdomain exists
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          current=$(curl -s -H "$auth" "$api" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).result?.subdomain||"")}catch{console.log("")}})')
          if [ -n "$current" ]; then
            echo "workers.dev subdomain already set: $current"
          else
            for name in "${WORKERS_SUBDOMAIN:-harsh24}" "harsh24-bot" "harsh24-wa-$RANDOM"; do
              out=$(curl -s -X PUT -H "$auth" -H "Content-Type: application/json" --data "{\"subdomain\":\"$name\"}" "$api")
              if echo "$out" | grep -q '"success":true'; then echo "Registered subdomain: $name"; break; fi
              echo "Could not register $name: $out"
            done
          fi

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Push secrets to the Worker
        run: |
          node -e '
            const names = ["WHATSAPP_TOKEN","PHONE_NUMBER_ID","VERIFY_TOKEN","APP_SECRET","OWNER_NUMBER","GROQ_KEY","GEMINI_KEY"];
            const out = {};
            for (const n of names) if (process.env[n]) out[n] = process.env[n];
            process.stdout.write(JSON.stringify(out));
          ' > "$RUNNER_TEMP/worker-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

      - name: Subscribe the Meta app to your WhatsApp account (so messages reach the webhook)
        run: |
          if [ -z "$WABA_ID" ]; then echo "::warning::No WhatsApp business account id found, skipping"; exit 0; fi
          out=$(curl -s -X POST -H "Authorization: Bearer ${WHATSAPP_TOKEN}" "https://graph.facebook.com/${GRAPH_VERSION:-v25.0}/${WABA_ID}/subscribed_apps")
          echo "$out" | sed -E 's/"access_token":"[^"]*"/"access_token":"***"/g'
          echo "$out" | grep -q '"success":true' || { echo "::error::Subscribe failed: $(echo "$out" | head -c 300)"; exit 1; }
