name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you click "Run workflow" in the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Your values live in the GitHub Environment named "APP_SECRET".
    environment: APP_SECRET
    env:
      # Each line accepts the standard name or the name used in this repo (secret or variable).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || secrets.CLOUDFLARE_DB_ID || secrets.CLOUDFARE_DB_ID || vars.D1_DATABASE_ID }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      APP_SECRET: ${{ secrets.APP_SECRET || secrets.WHATSAPP_APP_SECRET }}
      PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID || vars.PHONE_NUMBER_ID || vars.WHATSAPP_PHONE_NUMBER_ID || secrets.WHATSAPP_PHONE_NUMBER_ID }}
      VERIFY_TOKEN: ${{ secrets.VERIFY_TOKEN || vars.VERIFY_TOKEN }}
      OWNER_NUMBER: ${{ secrets.OWNER_NUMBER || vars.OWNER_NUMBER }}
      WABA_ID: ${{ vars.WHATSAPP_BUSINESS_ACCOUNT_ID || vars.WHATSAPP_BUISNESS_ACCOUNT_ID || secrets.WHATSAPP_BUSINESS_ACCOUNT_ID || secrets.WHATSAPP_BUISNESS_ACCOUNT_ID }}
      META_APP_ID: ${{ secrets.WHATSAPP_APP_ID || vars.WHATSAPP_APP_ID }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check required values
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID WHATSAPP_TOKEN PHONE_NUMBER_ID VERIFY_TOKEN APP_SECRET OWNER_NUMBER; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret or variable: $name"
              missing=1
            fi
          done
          exit $missing

      - name: Insert D1 database id into wrangler.toml
        run: sed -i "s/D1_DATABASE_ID_PLACEHOLDER/${D1_DATABASE_ID}/" wrangler.toml

      - name: Make sure a workers.dev subdomain exists
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          current=$(curl -s -H "$auth" "$api" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).result?.subdomain||"")}catch{console.log("")}})')
          if [ -n "$current" ]; then
            echo "workers.dev subdomain already set: $current"
          else
            for name in "${WORKERS_SUBDOMAIN:-harsh24}" "harsh24-bot" "harsh24-wa-$RANDOM"; do
              out=$(curl -s -X PUT -H "$auth" -H "Content-Type: application/json" --data "{\"subdomain\":\"$name\"}" "$api")
              if echo "$out" | grep -q '"success":true'; then echo "Registered subdomain: $name"; break; fi
              echo "Could not register $name: $out"
            done
          fi

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Push secrets to the Worker
        run: |
          node -e '
            const names = ["WHATSAPP_TOKEN","PHONE_NUMBER_ID","VERIFY_TOKEN","APP_SECRET","OWNER_NUMBER","GROQ_KEY","GEMINI_KEY"];
            const out = {};
            for (const n of names) if (process.env[n]) out[n] = process.env[n];
            process.stdout.write(JSON.stringify(out));
          ' > "$RUNNER_TEMP/worker-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

      - name: Subscribe the Meta app to your WhatsApp account and point it at this Worker
        run: |
          if [ -z "$WABA_ID" ]; then echo "::warning::No WhatsApp business account id found, skipping"; exit 0; fi
          sub=$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).result?.subdomain||"")}catch{console.log("")}})')
          url="https://wa-assistant.${sub}.workers.dev/webhook"
          echo "Webhook URL: $url"
          g="https://graph.facebook.com/${GRAPH_VERSION:-v25.0}/${WABA_ID}/subscribed_apps"
          out=$(curl -s -X POST -H "Authorization: Bearer ${WHATSAPP_TOKEN}" --data-urlencode "override_callback_uri=${url}" --data-urlencode "verify_token=${VERIFY_TOKEN}" "$g")
          echo "Subscribe response: $out" | head -c 400; echo
          echo "$out" | grep -q '"success":true' || { echo "::error::Subscribe failed: $(echo "$out" | head -c 300)"; exit 1; }
          echo "Current subscriptions:"; curl -s -H "Authorization: Bearer ${WHATSAPP_TOKEN}" "$g" | sed -E 's/"access_token":"[^"]*"/"access_token":"***"/g' | head -c 600; echo

      - name: Subscribe the Meta app to the messages field
        run: |
          META_APP_ID=$(printf %s "$META_APP_ID" | tr -d '[:space:]')
          WABA_ID=$(printf %s "$WABA_ID" | tr -d '[:space:]')
          if [ -z "$META_APP_ID" ]; then echo "::warning::No WHATSAPP_APP_ID found, skipping"; exit 0; fi
          sub=$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).result?.subdomain||"")}catch{console.log("")}})')
          url="https://wa-assistant.${sub}.workers.dev/webhook"
          api="https://graph.facebook.com/${GRAPH_VERSION:-v25.0}/${META_APP_ID}/subscriptions"
          tok="${META_APP_ID}|${APP_SECRET}"
          out=$(curl -s -X POST "$api" --data-urlencode "access_token=${tok}" --data-urlencode "object=whatsapp_business_account" --data-urlencode "callback_url=${url}" --data-urlencode "verify_token=${VERIFY_TOKEN}" --data-urlencode "fields=messages")
          echo "::notice title=app subscribe::$(echo "$out" | head -c 300)"
          echo "$out" | grep -q '"success":true' || { echo "::error::App subscribe failed (app id length ${#META_APP_ID}): $(echo "$out" | head -c 300)"; exit 1; }
          list=$(curl -s -G "$api" --data-urlencode "access_token=${tok}" | sed -E 's/"verify_token":"[^"]*"//g')
          echo "::notice title=app subscriptions::$(echo "$list" | head -c 600)"
          wlist=$(curl -s -H "Authorization: Bearer ${WHATSAPP_TOKEN}" "https://graph.facebook.com/${GRAPH_VERSION:-v25.0}/${WABA_ID}/subscribed_apps")
          echo "::notice title=waba subscribed_apps::$(echo "$wlist" | head -c 600)"

      - name: Health check (WhatsApp token and phone number)
        continue-on-error: true
        run: |
          META_APP_ID=$(printf %s "$META_APP_ID" | tr -d '[:space:]')
          v="${GRAPH_VERSION:-v25.0}"
          dbg=$(curl -s -G "https://graph.facebook.com/${v}/debug_token" --data-urlencode "input_token=${WHATSAPP_TOKEN}" --data-urlencode "access_token=${META_APP_ID}|${APP_SECRET}")
          echo "::notice title=token debug::$(echo "$dbg" | head -c 500)"
          ph=$(curl -s -H "Authorization: Bearer ${WHATSAPP_TOKEN}" "https://graph.facebook.com/${v}/${PHONE_NUMBER_ID}?fields=display_phone_number,verified_name,quality_rating")
          echo "::notice title=phone check::$(echo "$ph" | head -c 400)"
          echo "::notice title=owner number::length ${#OWNER_NUMBER}, starts $(printf %s "$OWNER_NUMBER" | head -c 4)"

      - name: Diagnostics (Gemini quota and models)
        continue-on-error: true
        run: |
          H="x-goog-api-key: ${GEMINI_KEY}"
          ml=$(curl -s -H "$H" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=100" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).models.map(m=>m.name.replace("models/","")).filter(n=>/flash|lite|pro/.test(n)&&!/tts|image|embed|live|audio|robotics/.test(n)).join(", "))}catch(e){console.log("list failed")}})')
          echo "::notice title=gemini models::${ml}" | head -c 900
          for model in gemini-flash-latest gemini-flash-lite-latest; do
            code=$(curl -s -o "$RUNNER_TEMP/p.json" -w '%{http_code}' -X POST "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent" -H "$H" -H 'Content-Type: application/json' --data '{"contents":[{"parts":[{"text":"Say hi"}]}]}')
            echo "::notice title=plain ${model}::HTTP ${code} $(head -c 200 "$RUNNER_TEMP/p.json" | tr '\n' ' ')"
          done
          code=$(curl -s -o "$RUNNER_TEMP/g.json" -w '%{http_code}' -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent" -H "$H" -H 'Content-Type: application/json' --data '{"contents":[{"parts":[{"text":"petrol price Ranchi today"}]}],"tools":[{"google_search":{}}]}')
          detail=$(node -e 'try{const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(JSON.stringify((j.error?.details||[]).map(d=>d.violations||d.retryDelay||d["@type"])).slice(0,600))}catch(e){console.log("n/a")}' "$RUNNER_TEMP/g.json")
          echo "::notice title=search detail::HTTP ${code} ${detail}"
