name = "wa-assistant"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Logs are visible in Cloudflare dashboard -> Workers & Pages -> wa-assistant -> Logs
[observability]
enabled = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "assistant-db"
# The GitHub Action replaces this placeholder with your D1_DATABASE_ID at deploy time.
database_id = "D1_DATABASE_ID_PLACEHOLDER"
migrations_dir = "migrations"

# Runs every minute (UTC) to deliver due reminders.
[triggers]
crons = ["* * * * *"]

# Non-secret settings. Secrets (tokens etc.) are pushed by the GitHub Action.
[vars]
GRAPH_VERSION = "v25.0"
TEMPLATE_NAME = "reminder"
TEMPLATE_LANG = "en"
DEFAULT_COUNTRY_CODE = "91"
# Order the bot tries AI providers in. Providers without a key are skipped.
# Options: workers-ai, groq, gemini
LLM_PROVIDERS = "workers-ai,groq,gemini"
LLM_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GROQ_MODEL = "llama-3.3-70b-versatile"
GEMINI_MODEL = "gemini-flash-latest"
# Morning briefing time in UTC (02:30 UTC = 08:00 IST).
BRIEFING_TIME_UTC = "02:30"
# Nightly journal prompt (16:00 UTC = 21:30 IST) and daily quiz (07:30 UTC = 13:00 IST).
JOURNAL_TIME_UTC = "16:00"
QUIZ_TIME_UTC = "07:30"
# Habit nudge (15:00 UTC = 20:30 IST) and news digest (03:00 UTC = 08:30 IST).
HABIT_TIME_UTC = "15:00"
NEWS_TIME_UTC = "03:00"
# Calorie tracker meal prompts: 06:30 UTC = 12:00 IST breakfast, 08:30 = 14:00 lunch, 11:10 = 16:40 snack, 16:00 = 21:30 dinner.
CAL_BREAKFAST_TIME_UTC = "06:30"
CAL_LUNCH_TIME_UTC = "08:30"
CAL_SNACK_TIME_UTC = "11:10"
CAL_DINNER_TIME_UTC = "16:00"
# Sunday calorie summary (15:15 UTC = 20:45 IST).
CAL_WEEKLY_TIME_UTC = "15:15"
